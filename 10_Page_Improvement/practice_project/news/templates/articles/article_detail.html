<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ article.title }}</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;}.container{max-width:900px;margin:0 auto;padding:20px;}.back{color:#667eea;text-decoration:none;margin-bottom:20px;display:block;}.back:hover{text-decoration:underline;}article{background:white;padding:40px;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}h1{color:#333;margin-bottom:20px;}article .meta{color:#999;font-size:14px;border-bottom:1px solid #eee;padding-bottom:20px;margin-bottom:20px;}article .meta span{margin-right:20px;}article .content{line-height:1.8;color:#333;margin:20px 0;}article .content p{margin-bottom:15px;}</style></head><body><div class="container"><a href="{% url 'articles:list' %}" class="back">← 목록으로</a><article><h1>{{ article.title }}</h1><div class="meta"><span>{{ article.author.username }}</span><span>{{ article.created_at|date:"Y년 m월 d일" }}</span><span>{{ article.reading_time }}분 읽음</span><span>조회: {{ article.view_count }}</span></div><div class="content">{{ article.content|linebreaks }}</div></article></div></body></html>
