{% extends 'blog/base.html' %}

{% block title %}포스트 작성{% endblock %}

{% block content %}
<h1 class="mb-4">{% if form.instance.pk %}포스트 수정{% else %}새 포스트 작성{% endif %}</h1>

<div class="row">
    <div class="col-md-8">
        <form method="post" class="card p-4">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">{{ form.instance.pk|yesno:"수정,저장" }}</button>
                <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
