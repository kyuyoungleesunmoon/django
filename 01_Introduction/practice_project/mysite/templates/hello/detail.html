<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메시지 상세보기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back:hover {
            text-decoration: underline;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .message-content {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .meta {
            font-size: 14px;
            color: #666;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }
        
        .meta-item {
            margin-bottom: 10px;
        }
        
        .meta-label {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'hello:index' %}" class="back">← 돌아가기</a>
        
        <h1>{{ message.title }}</h1>
        
        <div class="message-content">
            {{ message.content|linebreaks }}
        </div>
        
        <div class="meta">
            <div class="meta-item">
                <span class="meta-label">작성시간:</span> {{ message.created_at|date:"Y년 m월 d일 H:i" }}
            </div>
            <div class="meta-item">
                <span class="meta-label">수정시간:</span> {{ message.updated_at|date:"Y년 m월 d일 H:i" }}
            </div>
        </div>
    </div>
</body>
</html>
