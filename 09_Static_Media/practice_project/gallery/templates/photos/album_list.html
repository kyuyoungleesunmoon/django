{% load static %}<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>갤러리</title><link rel="stylesheet" href="{% static 'css/style.css' %}"><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;}header{background:#333;color:white;padding:20px;text-align:center;}h1{margin:0;}.container{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}.album{background:white;border-radius:5px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.1);transition:transform 0.2s;}.album:hover{transform:translateY(-5px);}.album-header{padding:20px;}.album-header h2{margin:0 0 10px 0;color:#333;}.album-header p{color:#666;font-size:14px;}.album-footer{padding:10px 20px;background:#f9f9f9;text-align:center;}.album-footer a{color:#667eea;text-decoration:none;}.album-footer a:hover{text-decoration:underline;}</style></head><body><header><h1>📷 갤러리</h1></header><div class="container">{% for album in albums %}<div class="album"><div class="album-header"><h2>{{ album.name }}</h2>{% if album.description %}<p>{{ album.description }}</p>{% endif %}</div><div class="album-footer"><a href="{% url 'photos:album_detail' album.id %}">앨범 보기 ({{ album.photos.count }})</a></div></div>{% endfor %}</div></body></html>
