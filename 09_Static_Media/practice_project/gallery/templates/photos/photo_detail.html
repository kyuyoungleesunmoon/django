<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ photo.title }}</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;}.container{max-width:900px;margin:0 auto;padding:20px;}.back{color:#667eea;text-decoration:none;margin-bottom:20px;display:block;}.back:hover{text-decoration:underline;}.photo-viewer{background:white;border-radius:5px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.1);}img.main{width:100%;height:auto;display:block;}.photo-info{padding:30px;}.photo-info h1{color:#333;margin-bottom:20px;}.photo-info p{color:#666;line-height:1.6;margin-bottom:20px;}.meta{color:#999;font-size:14px;border-top:1px solid #eee;padding-top:20px;}</style></head><body><div class="container"><a href="{% url 'photos:album_detail' photo.album.id %}" class="back">← {{ photo.album.name }}</a><div class="photo-viewer">{% if photo.image %}<img src="{{ photo.image.url }}" alt="{{ photo.title }}" class="main" />{% endif %}<div class="photo-info"><h1>{{ photo.title }}</h1>{% if photo.description %}<p>{{ photo.description }}</p>{% endif %}<div class="meta"><div>추가: {{ photo.created_at|date:"Y-m-d H:i" }}</div></div></div></div></div></body></html>
