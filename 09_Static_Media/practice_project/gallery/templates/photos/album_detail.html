{% load static %}<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ album.name }}</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;}.container{max-width:1200px;margin:0 auto;padding:20px;}.back{color:#667eea;text-decoration:none;margin-bottom:20px;display:block;}.back:hover{text-decoration:underline;}h1{color:#333;margin-bottom:30px;}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;}.photo{background:white;border-radius:5px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.1);transition:transform 0.2s;}.photo:hover{transform:translateY(-5px);}.photo img{width:100%;height:200px;object-fit:cover;}.photo-info{padding:15px;}.photo-info h3{margin:0 0 10px 0;color:#333;}.photo-info a{color:#667eea;text-decoration:none;}.photo-info a:hover{text-decoration:underline;}</style></head><body><div class="container"><a href="{% url 'photos:album_list' %}" class="back">← 앨범 목록</a><h1>{{ album.name }}</h1><div class="photos">{% for photo in album.photos.all %}<div class="photo">{% if photo.image %}<img src="{{ photo.image.url }}" alt="{{ photo.title }}" />{% endif %}<div class="photo-info"><h3>{{ photo.title }}</h3><a href="{% url 'photos:photo_detail' photo.id %}">상세보기</a></div></div>{% endfor %}</div></div></body></html>
