<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express API 테스트 - Blog Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .container {
            max-width: 1200px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            font-weight: bold;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            color: white;
        }
        .post-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .post-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .badge-custom {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .api-status {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <!-- API 상태 표시 -->
    <div class="api-status">
        <div class="alert alert-info" id="apiStatus">
            <strong>API:</strong> <span id="statusText">확인 중...</span>
        </div>
    </div>

    <div class="container">
        <h1 class="text-white text-center mb-5">📝 Blog Manager</h1>
        <p class="text-white text-center mb-4">Express API와 연동되는 블로그 관리 시스템</p>

        <!-- 새 포스트 작성 폼 -->
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">✍️ 새 포스트 작성</h3>
            </div>
            <div class="card-body">
                <form id="postForm">
                    <div class="row">
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label for="title" class="form-label">제목</label>
                                <input type="text" class="form-control" id="title" required minlength="3">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="author" class="form-label">작성자</label>
                                <input type="text" class="form-control" id="author" required>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">내용</label>
                        <textarea class="form-control" id="content" rows="4" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="tags" class="form-label">태그 (쉼표로 구분)</label>
                        <input type="text" class="form-control" id="tags" placeholder="예: javascript, nodejs, express">
                    </div>
                    <button type="submit" class="btn btn-gradient btn-lg">
                        📤 포스트 작성
                    </button>
                </form>
            </div>
        </div>

        <!-- 검색 및 필터 -->
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">🔍 검색 및 필터</h3>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="searchInput" placeholder="제목/내용 검색...">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="authorFilter" placeholder="작성자 필터...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="sortBy">
                            <option value="">정렬 방식</option>
                            <option value="date">날짜순</option>
                            <option value="title">제목순</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-gradient w-100" onclick="loadPosts()">
                            🔄 새로고침
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 포스트 목록 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="mb-0">📚 포스트 목록</h3>
                <span class="badge bg-light text-dark" id="postCount">0개</span>
            </div>
            <div class="card-body">
                <div id="postsContainer" class="row">
                    <!-- 포스트가 여기 표시됩니다 -->
                </div>
            </div>
        </div>

        <!-- API 응답 보기 (개발자용) -->
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">🔧 API 응답 (개발자 도구)</h3>
            </div>
            <div class="card-body">
                <pre id="apiResponse">API 요청 후 응답이 여기 표시됩니다...</pre>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/posts';
        
        // ============================================
        // API 상태 체크
        // ============================================
        async function checkAPIStatus() {
            try {
                const response = await fetch('http://localhost:3000/api/health');
                if (response.ok) {
                    document.getElementById('statusText').textContent = '🟢 연결됨';
                    document.getElementById('apiStatus').className = 'alert alert-success';
                } else {
                    throw new Error('API 응답 오류');
                }
            } catch (error) {
                document.getElementById('statusText').textContent = '🔴 연결 실패';
                document.getElementById('apiStatus').className = 'alert alert-danger';
            }
        }

        // ============================================
        // 포스트 목록 불러오기
        // ============================================
        async function loadPosts() {
            try {
                // 쿼리 파라미터 구성
                const params = new URLSearchParams();
                const search = document.getElementById('searchInput').value;
                const author = document.getElementById('authorFilter').value;
                const sortBy = document.getElementById('sortBy').value;
                
                if (search) params.append('search', search);
                if (author) params.append('author', author);
                if (sortBy) params.append('sortBy', sortBy);
                
                const url = `${API_URL}?${params.toString()}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                displayAPIResponse(result);
                displayPosts(result.data);
                
                // 포스트 개수 업데이트
                document.getElementById('postCount').textContent = `${result.count}개`;
            } catch (error) {
                console.error('Error:', error);
                alert('포스트를 불러오는데 실패했습니다: ' + error.message);
            }
        }

        // ============================================
        // 포스트 표시
        // ============================================
        function displayPosts(posts) {
            const container = document.getElementById('postsContainer');
            
            if (posts.length === 0) {
                container.innerHTML = '<div class="col-12"><p class="text-center text-muted">포스트가 없습니다.</p></div>';
                return;
            }
            
            container.innerHTML = posts.map(post => `
                <div class="col-md-6 mb-4">
                    <div class="card post-card h-100" onclick="viewPost(${post.id})">
                        <div class="card-body">
                            <h5 class="card-title">${escapeHtml(post.title)}</h5>
                            <p class="card-text text-muted">${escapeHtml(post.content.substring(0, 100))}...</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-muted">✍️ ${escapeHtml(post.author)}</small>
                                <small class="text-muted">📅 ${new Date(post.createdAt).toLocaleDateString('ko-KR')}</small>
                            </div>
                            ${post.tags && post.tags.length > 0 ? `
                                <div class="mt-2">
                                    ${post.tags.map(tag => `<span class="badge badge-custom me-1">${escapeHtml(tag)}</span>`).join('')}
                                </div>
                            ` : ''}
                            <div class="mt-3">
                                <button class="btn btn-sm btn-warning" onclick="event.stopPropagation(); editPost(${post.id})">✏️ 수정</button>
                                <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); deletePost(${post.id})">🗑️ 삭제</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // 새 포스트 작성
        // ============================================
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const author = document.getElementById('author').value;
            const tagsInput = document.getElementById('tags').value;
            const tags = tagsInput ? tagsInput.split(',').map(tag => tag.trim()) : [];
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, content, author, tags })
                });
                
                const result = await response.json();
                displayAPIResponse(result);
                
                if (response.ok) {
                    alert('✅ 포스트가 작성되었습니다!');
                    document.getElementById('postForm').reset();
                    loadPosts();
                } else {
                    alert('❌ 오류: ' + result.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('포스트 작성에 실패했습니다: ' + error.message);
            }
        });

        // ============================================
        // 포스트 상세 보기
        // ============================================
        async function viewPost(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const result = await response.json();
                displayAPIResponse(result);
                
                if (response.ok) {
                    const post = result.data;
                    alert(`
제목: ${post.title}
작성자: ${post.author}
내용: ${post.content}
태그: ${post.tags.join(', ')}
작성일: ${new Date(post.createdAt).toLocaleString('ko-KR')}
                    `.trim());
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // ============================================
        // 포스트 수정
        // ============================================
        async function editPost(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const result = await response.json();
                
                if (!response.ok) {
                    alert('포스트를 찾을 수 없습니다.');
                    return;
                }
                
                const post = result.data;
                const newTitle = prompt('제목 수정:', post.title);
                
                if (newTitle && newTitle !== post.title) {
                    const updateResponse = await fetch(`${API_URL}/${id}`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ title: newTitle })
                    });
                    
                    const updateResult = await updateResponse.json();
                    displayAPIResponse(updateResult);
                    
                    if (updateResponse.ok) {
                        alert('✅ 포스트가 수정되었습니다!');
                        loadPosts();
                    } else {
                        alert('❌ 수정 실패: ' + updateResult.error);
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                alert('포스트 수정에 실패했습니다.');
            }
        }

        // ============================================
        // 포스트 삭제
        // ============================================
        async function deletePost(id) {
            if (!confirm('정말로 이 포스트를 삭제하시겠습니까?')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                displayAPIResponse(result);
                
                if (response.ok) {
                    alert('✅ 포스트가 삭제되었습니다!');
                    loadPosts();
                } else {
                    alert('❌ 삭제 실패: ' + result.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('포스트 삭제에 실패했습니다.');
            }
        }

        // ============================================
        // API 응답 표시
        // ============================================
        function displayAPIResponse(data) {
            document.getElementById('apiResponse').textContent = JSON.stringify(data, null, 2);
        }

        // ============================================
        // XSS 방지를 위한 이스케이프
        // ============================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // 검색 입력시 자동 검색
        // ============================================
        document.getElementById('searchInput').addEventListener('input', () => {
            loadPosts();
        });
        
        document.getElementById('authorFilter').addEventListener('input', () => {
            loadPosts();
        });
        
        document.getElementById('sortBy').addEventListener('change', () => {
            loadPosts();
        });

        // ============================================
        // 페이지 로드시 실행
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            checkAPIStatus();
            loadPosts();
            
            // 5초마다 API 상태 체크
            setInterval(checkAPIStatus, 5000);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
