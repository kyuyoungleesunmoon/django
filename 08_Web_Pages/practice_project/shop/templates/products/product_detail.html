<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ product.name }}</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;}.container{max-width:900px;margin:0 auto;padding:20px;}.back{color:#667eea;text-decoration:none;margin-bottom:20px;display:block;}.back:hover{text-decoration:underline;}.product-detail{background:white;padding:40px;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}h1{color:#333;margin-bottom:15px;}.category{color:#999;margin-bottom:20px;}.price{font-size:28px;color:#e74c3c;font-weight:bold;margin:20px 0;}.stock{color:#666;margin:10px 0;}.description{line-height:1.6;color:#555;margin:20px 0;}.meta{color:#999;font-size:14px;border-top:1px solid #eee;padding-top:20px;margin-top:20px;}</style></head><body><div class="container"><a href="{% url 'products:list' %}" class="back">← 목록으로</a><div class="product-detail"><h1>{{ product.name }}</h1><div class="category">분류: <a href="{% url 'products:category' product.category.slug %}" style="color:#667eea;">{{ product.category.name }}</a></div><div class="price">{{ product.price|floatformat:0 }}원</div><div class="stock">✓ 재고: {{ product.stock }}개</div><div class="description">{{ product.description|linebreaks }}</div><div class="meta"><div>추가: {{ product.created_at|date:"Y-m-d" }}</div><div>수정: {{ product.updated_at|date:"Y-m-d" }}</div></div></div></div></body></html>
