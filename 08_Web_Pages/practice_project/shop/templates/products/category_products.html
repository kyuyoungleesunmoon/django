<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ category.name }}</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;}.container{max-width:1200px;margin:0 auto;padding:20px;}.back{color:#667eea;text-decoration:none;margin-bottom:20px;display:block;}.back:hover{text-decoration:underline;}h1{color:#333;margin-bottom:30px;}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;}.product-card{background:white;border-radius:5px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.1);transition:transform 0.2s;}.product-card:hover{transform:translateY(-5px);}.product-card h3{padding:15px;margin:0;}.product-card .price{color:#e74c3c;font-size:18px;font-weight:bold;padding:0 15px;}.product-card .stock{color:#999;font-size:12px;padding:10px 15px 0 15px;}.product-card a{display:block;padding:10px 15px;color:#667eea;text-decoration:none;text-align:center;border-top:1px solid #eee;}.product-card a:hover{background:#f9f9f9;}</style></head><body><div class="container"><a href="{% url 'products:list' %}" class="back">← 목록으로</a><h1>{{ category.name }}</h1><div class="products">{% for product in products %}<div class="product-card"><h3>{{ product.name }}</h3><div class="price">{{ product.price|floatformat:0 }}원</div><div class="stock">재고: {{ product.stock }}</div><a href="{% url 'products:detail' product.slug %}">상세보기</a></div>{% endfor %}</div></div></body></html>
